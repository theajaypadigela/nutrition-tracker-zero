buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // Prefer the Notifee artifacts bundled inside node_modules to avoid flaky network resolution.
        maven { url("$rootDir/../node_modules/@notifee/react-native/android/libs") }
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "app.notifee" && details.requested.name == "core" && details.requested.version == "+") {
                details.useVersion("202108261754")
                details.because("Avoid remote metadata lookup for dynamic Notifee core version")
            }
        }
    }
}
