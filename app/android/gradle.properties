# Project-wide Gradle settings. No secrets here: release signing reads NTZ_RELEASE_* from ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
# Override per build with -PreactNativeArchitectures=arm64-v8a for faster debug builds.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
hermesEnabled=true
edgeToEdgeEnabled=false
